---
layout: default
---

<div class="home">
  <div class="posts">
    {% for post in site.posts %}
    <div class="post-teaser">
      <div class="teaser-text">
        <h2 class="teaser-title">
          <a class="post-link" href="{{ post.url | relative_url }}">{{ post.title }}</a>
        </h2>
        <p class="meta">{{ post.date | date: "%B %-d, %Y" }}</p>
        <p class="teaser-summary">{{ post.description | default: post.excerpt | strip_html | truncatewords: 30 }}</p>
      </div>
      <a class="teaser-arrow" href="{{ post.url | relative_url }}" aria-label="{{ site.theme_settings.str_continue_reading }}: {{ post.title }}">
        {% include icon.html name="arrow-right" %}
      </a>
    </div>
    {% endfor %}
  </div>

</div>
