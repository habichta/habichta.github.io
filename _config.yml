# SITE CONFIGURATION
baseurl: ""
url: "https://habichta.com"
permalink: /:title.html

# THEME-SPECIFIC CONFIGURATION
theme_settings:
  # Meta
  title: Arthur Habicht
  avatar: assets/img/avatar.jpg
  favicon: assets/favicon.ico
  gravatar: # Email MD5 hash
  description: "Arthur Habicht, co-founder and CTO of Helpany. Expert in software engineering, production-grade machine learning and Physical AI, based in Zurich." # used by search engines

  # Header and footer text
  header_text: Welcome
  header_text_feature_image:
  footer_text:

  # Icons
  rss: false
  email_address: "habichta.shore104@passmail.net" # Full email address, e.g. "sam@example.com"
  github: "habichta"
  huggingface: "habichta"
  linkedin: "https://www.linkedin.com/in/arthur-habicht-16546240/" # Full URL

  # Scripts
  google_analytics: # Tracking ID, e.g. "UA-000000-01"
  disqus_shortname:
  katex: true # Enable if using math markup
  search: false # Enable the search feature

  # Localization strings
  str_follow_on: "Follow on"
  str_rss_follow: "Follow RSS feed"
  str_email: "Email"
  str_next_post: "Next post"
  str_previous_post: "Previous post"
  str_next_page: "Next"
  str_previous_page: "Prev"
  str_continue_reading: "Continue reading"
  str_javascript_required_disqus: "Please enable JavaScript to view comments."
  str_search_no_results: "No results found."

  # Colours, typography and padding
  google_fonts: # Self-hosted in _sass/base/_fonts.scss

  # Post navigation
  post_navigation: false

# BUILD SETTINGS
markdown: kramdown
highlighter: rouge
sass:
  sass_dir: _sass
  style: :compressed
plugins:
  - jekyll-redirect-from
  - jekyll-sitemap
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - blog-ideas.md
defaults:
  - scope:
      path: "assets/CV.pdf"
    values:
      sitemap: false
  - scope:
      path: "ai_gets_physical_arthur_habicht_november_2026.pdf"
    values:
      sitemap: false
